<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legislation graph · Build pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · UK Legislation Graph</p>
    <h1>Graph build pipeline</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-pipeline-title build-pipeline-desc">
      <title id="build-pipeline-title">Graph build pipeline</title>
      <desc id="build-pipeline-desc">Data-flow diagram showing CLML XML crawled from legislation.gov.uk into JSON, loaded by PySpark into a central Neo4j knowledge graph, which is then enriched after load by the vectorize, indices and queries stages.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: ingest (drawn before arrows + nodes) -->
      <rect x="24" y="168" width="708" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="172" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="181" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INGEST · BUILD</text>

      <!-- Zone: enrich (after load) -->
      <rect x="388" y="340" width="484" height="92" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="404" y="344" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="482" y="353" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENRICH · AFTER LOAD</text>

      <!-- ================= Arrows (behind boxes) ================= -->
      <!-- Ingest chain -->
      <line x1="180" y1="232" x2="220" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="364" y1="232" x2="404" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="524" y1="232" x2="564" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Primary flow: loader -> Neo4j -->
      <line x1="708" y1="232" x2="812" y2="232" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Enrich (dashed, run after load) up into Neo4j bottom edge -->
      <path d="M 476,360 V 320 Q 476,312 484,312 H 828 Q 836,312 836,304 V 280" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 632,360 V 336 Q 632,328 640,328 H 868 Q 876,328 876,320 V 280" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 786,360 V 352 Q 786,344 794,344 H 908 Q 916,344 916,336 V 280" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ================= Arrow labels ================= -->
      <rect x="180" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FETCH</text>
      <rect x="364" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>
      <rect x="524" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
      <rect x="736" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="756" y="221" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD</text>

      <rect x="536" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="301" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>
      <rect x="696" y="308" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="317" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INDEX</text>
      <rect x="820" y="324" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="333" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINK</text>

      <!-- ================= Nodes ================= -->
      <!-- Source (external) -->
      <rect x="40" y="200" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="140" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="48" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="62" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="110" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">legislation.gov.uk</text>
      <text x="110" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLML XML</text>

      <!-- Crawler -->
      <rect x="220" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="200" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="228" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="248" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRAWL</text>
      <text x="356" y="258" fill="rgba(45,49,66,0.06)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="292" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Crawler</text>
      <text x="292" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crawler.py</text>

      <!-- json_out (store) -->
      <rect x="404" y="200" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="404" y="200" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="412" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="426" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="464" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JSON output</text>
      <text x="464" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">json_out/&lt;year&gt;</text>

      <!-- Loader -->
      <rect x="564" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="564" y="200" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="572" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="592" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPARK</text>
      <text x="700" y="258" fill="rgba(45,49,66,0.06)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="636" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loader</text>
      <text x="636" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loader.py</text>

      <!-- Neo4j (focal store) -->
      <rect x="812" y="184" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="812" y="184" width="160" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="820" y="192" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="834" y="201" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="892" y="240" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Neo4j</text>
      <text x="892" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Knowledge Graph</text>

      <!-- Vectorize (enrich) -->
      <rect x="404" y="360" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="404" y="360" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="412" y="366" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="434" y="375" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>
      <text x="540" y="410" fill="rgba(45,49,66,0.06)" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">03</text>
      <text x="476" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vectorize</text>
      <text x="476" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vectorize.py</text>

      <!-- Indices (enrich) -->
      <rect x="572" y="360" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="580" y="366" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="600" y="375" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INDEX</text>
      <text x="684" y="410" fill="rgba(45,49,66,0.06)" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">04</text>
      <text x="632" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Indices</text>
      <text x="632" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">indices.py</text>

      <!-- Queries (enrich) -->
      <rect x="716" y="360" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="716" y="360" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="724" y="366" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="738" y="375" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
      <text x="848" y="410" fill="rgba(45,49,66,0.06)" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">05</text>
      <text x="786" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Queries</text>
      <text x="786" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">queries.py</text>

      <!-- ================= Legend ================= -->
      <line x1="40" y1="452" x2="960" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="484" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Knowledge graph (focal)</text>

      <rect x="232" y="484" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pipeline stage (src/*.py)</text>

      <rect x="436" y="484" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="456" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Filesystem store</text>

      <rect x="584" y="484" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="604" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External source</text>

      <line x1="712" y1="490" x2="740" y2="490" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="748" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Build flow</text>

      <line x1="856" y1="490" x2="884" y2="490" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="892" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Enrich</text>
    </svg>
  </div>
</body>
</html>
